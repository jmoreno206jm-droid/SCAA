<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Asistencia ADECCO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#E4002B">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Librería QR -->
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
:root{
  --adecco:#E4002B;
  --adecco-dark:#B30022;
  --adecco-light:#FF4D5C;
  --adecco-soft:#FFE6E9;
  --green:#00A850;
  --green-dark:#008840;
  --green-light:#34D399;
  --yellow:#FFB800;
  --yellow-dark:#E0A000;
  --yellow-light:#FCD34D;
  --red-error:#DC2626;
  --red-error-dark:#B91C1C;
  --white:#FFFFFF;
  --gray-50:#F9FAFB;
  --gray-100:#F3F4F6;
  --gray-200:#E5E7EB;
  --text-dark:#1F2937;
  --text-muted:#6B7280;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
}

html, body {
  width: 100%;
  min-height: 100vh;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(180deg,var(--adecco) 0%,var(--adecco-dark) 100%);
  padding: 16px;
  position:relative;
  overflow-x:hidden;
}

/* Elementos decorativos de fondo */
body::before, body::after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.06);
  animation:flotar 8s ease-in-out infinite;
}
body::before{
  width:300px;
  height:300px;
  top:-100px;
  right:-80px;
  animation-delay:0s;
}
body::after{
  width:200px;
  height:200px;
  bottom:-60px;
  left:-60px;
  animation-delay:3s;
}

@keyframes flotar{
  0%,100%{transform:translateY(0) rotate(0deg);}
  50%{transform:translateY(-25px) rotate(5deg);}
}

/* Tarjeta principal — CENTRADA Y RESPONSIVA */
.card{
  width: 100%;
  max-width: 400px;
  background:var(--white);
  border-radius:32px;
  padding: 28px 20px;
  box-shadow:0 25px 80px rgba(0,0,0,.35);
  position:relative;
  z-index:1;
  animation:entradaSuave .7s cubic-bezier(0.22,1,0.36,1);
  margin: 0 auto;
}

@keyframes entradaSuave{
  from{opacity:0;transform:translateY(40px) scale(.92);}
  to{opacity:1;transform:translateY(0) scale(1);}
}

/* Logo Adecco */
.logo-contenedor{
  text-align:center;
  margin-bottom:24px;
}
.logo-adecco{
  font-size:clamp(32px, 8vw, 42px);
  font-weight:900;
  letter-spacing:-1px;
  color:var(--adecco);
  text-shadow:0 4px 12px rgba(228,0,43,.15);
  position:relative;
  display:inline-block;
}
.logo-adecco span{color:var(--adecco-dark)}
.logo-adecco::after{
  content:"";
  position:absolute;
  bottom:-6px;
  left:10%;
  width:80%;
  height:4px;
  background:linear-gradient(90deg,var(--adecco),var(--adecco-light),var(--adecco));
  border-radius:2px;
  animation:brillar 3s ease-in-out infinite;
}
@keyframes brillar{
  0%,100%{opacity:.7;transform:scaleX(.8);}
  50%{opacity:1;transform:scaleX(1);}
}
.subtitulo{
  text-align:center;
  color:var(--text-muted);
  font-size:clamp(13px, 3.5vw, 15px);
  margin-top:12px;
}

/* Inputs */
input{
  width:100%;
  padding:14px 16px;
  border-radius:16px;
  border:2px solid var(--gray-200);
  text-align:center;
  font-size:clamp(16px, 4vw, 17px);
  transition:.3s cubic-bezier(0.4,0,0.2,1);
  background:var(--gray-50);
  margin-bottom:14px;
}
input:focus{
  outline:none;
  border-color:var(--adecco);
  background:var(--white);
  box-shadow:0 0 0 5px rgba(228,0,43,.12),0 8px 20px rgba(228,0,43,.15);
  transform:translateY(-2px);
}

/* Botones base */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;
  font-size:clamp(15px, 3.8vw, 16px);
  font-weight:700;
  cursor:pointer;
  transition:.3s cubic-bezier(0.4,0,0.2,1);
  letter-spacing:.3px;
}
button:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.2)}
button:active{transform:translateY(0);box-shadow:0 6px 15px rgba(0,0,0,.15)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

.btn-buscar{
  background:linear-gradient(135deg,var(--adecco),var(--adecco-dark));
  color:var(--white);
  box-shadow:0 8px 24px rgba(228,0,43,.4);
}
.btn-buscar:hover{box-shadow:0 14px 35px rgba(228,0,43,.45)}

.btn-entrada{
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  color:var(--white);
  box-shadow:0 8px 24px rgba(0,168,80,.35);
  margin-bottom:12px;
}
.btn-entrada:hover{box-shadow:0 14px 35px rgba(0,168,80,.4)}

.btn-salida{
  background:linear-gradient(135deg,var(--yellow),var(--yellow-dark));
  color:#000;
  box-shadow:0 8px 24px rgba(255,184,0,.35);
}
.btn-salida:hover{box-shadow:0 14px 35px rgba(255,184,0,.4)}

.btn-cancelar{
  background:var(--gray-100);
  color:var(--text-dark);
  margin-top:10px;
}

/* Foto de perfil */
.foto-contenedor{
  position:relative;
  width:130px;
  height:130px;
  margin:0 auto 16px;
}
.foto{
  width:130px;
  height:130px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid var(--adecco);
  box-shadow:0 0 0 4px var(--adecco-soft),0 15px 35px rgba(228,0,43,.25);
  background:var(--gray-100);
  animation:aparecer .6s ease-out;
}
@keyframes aparecer{
  from{transform:scale(.7);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* Datos del empleado */
.nombre{
  font-size:clamp(18px, 5vw, 20px);
  font-weight:800;
  color:var(--text-dark);
  text-align:center;
  margin-bottom:4px;
}
.cargo{
  text-align:center;
  color:var(--text-muted);
  font-size:clamp(14px, 3.8vw, 15px);
  margin-bottom:16px;
}

/* Reloj y fecha */
.reloj{
  text-align:center;
  font-size:clamp(28px, 7vw, 32px);
  font-weight:900;
  color:var(--adecco);
  letter-spacing:1px;
  animation:pulseTiempo 2s ease-in-out infinite;
}
@keyframes pulseTiempo{
  0%,100%{color:var(--adecco)}
  50%{color:var(--adecco-dark)}
}
.fecha{
  text-align:center;
  color:var(--text-muted);
  font-size:clamp(13px, 3.5vw, 14px);
  margin-bottom:20px;
}

/* ==============================================
   MODALES ANIMADOS
   ============================================== */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(12px);
  justify-content:center;
  align-items:center;
  z-index:100;
  padding: 16px;
  animation:fadeIn .3s ease;
}
.modal.activo{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.modal-contenido{
  background:var(--white);
  border-radius:28px;
  padding: 28px 20px;
  width:100%;
  max-width:340px;
  box-shadow:0 35px 90px rgba(0,0,0,.4);
  animation:modalEntrada .5s cubic-bezier(0.34,1.56,0.64,1);
  transform-origin:center;
  margin: 0 auto;
}
@keyframes modalEntrada{
  0%{opacity:0;transform:scale(.7) translateY(30px)}
  60%{transform:scale(1.05) translateY(-5px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}

/* ==============================================
   ✅ CONFIRMACIÓN — ANIMACIONES
   ============================================== */
.icono-check{
  width:clamp(80px, 20vw, 96px);
  height:clamp(80px, 20vw, 96px);
  border-radius:50%;
  border:4px solid;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 20px;
  animation:iconoRebote .8s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes iconoRebote{
  0%{transform:scale(0) rotate(-20deg)}
  50%{transform:scale(1.2) rotate(5deg)}
  70%{transform:scale(.95) rotate(-2deg)}
  100%{transform:scale(1) rotate(0deg)}
}
.icono-check svg{
  width:clamp(44px, 11vw, 52px);
  height:clamp(44px, 11vw, 52px);
  fill:none;
  stroke-width:4;
  stroke-dasharray:100;
  stroke-dashoffset:100;
  animation:dibujarCheck .7s ease forwards .35s;
}
@keyframes dibujarCheck{to{stroke-dashoffset:0}}

.confirm-entrada .icono-check{
  border-color:var(--green);
  background:linear-gradient(135deg,rgba(0,168,80,.12),rgba(52,211,153,.08));
  box-shadow:0 0 0 8px rgba(0,168,80,.06),0 0 40px rgba(0,168,80,.25);
}
.confirm-entrada svg{stroke:var(--green)}
.confirm-salida .icono-check{
  border-color:var(--yellow);
  background:linear-gradient(135deg,rgba(255,184,0,.14),rgba(252,211,77,.08));
  box-shadow:0 0 0 8px rgba(255,184,0,.06),0 0 40px rgba(255,184,0,.25);
}
.confirm-salida svg{stroke:var(--yellow)}

.etiqueta-estado{
  display:inline-block;
  padding:12px 24px;
  border-radius:50px;
  font-weight:800;
  font-size:clamp(14px, 3.8vw, 16px);
  animation:etiquetaAparece .6s ease forwards .4s;
  opacity:0;
  transform:translateY(10px);
}
@keyframes etiquetaAparece{to{opacity:1;transform:translateY(0)}}

.confirm-entrada .etiqueta-estado{
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  color:#fff;
  box-shadow:0 6px 20px rgba(0,168,80,.35);
}
.confirm-salida .etiqueta-estado{
  background:linear-gradient(135deg,var(--yellow),var(--yellow-dark));
  color:#000;
  box-shadow:0 6px 20px rgba(255,184,0,.35);
}

.mensaje-confirmacion{
  margin-top:18px;
  color:var(--text-dark);
  font-size:clamp(14px, 3.8vw, 15px);
  line-height:1.6;
  animation:textoAparece .6s ease forwards .55s;
  opacity:0;
  transform:translateY(8px);
  text-align:center;
}
@keyframes textoAparece{to{opacity:1;transform:translateY(0)}}

/* ==============================================
   ⚠️ MENSAJE DE ERROR — ANIMACIONES PROPIAS
   ============================================== */
.error-icono{
  width:clamp(80px, 20vw, 96px);
  height:clamp(80px, 20vw, 96px);
  border-radius:50%;
  border:4px solid var(--red-error);
  background:linear-gradient(135deg,rgba(220,38,38,.12),rgba(248,113,113,.06));
  box-shadow:0 0 0 8px rgba(220,38,38,.06),0 0 40px rgba(220,38,38,.25);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 20px;
  animation:iconoErrorEntrada .7s cubic-bezier(0.34,1.56,0.64,1), sacudir .6s ease .2s;
}
@keyframes iconoErrorEntrada{
  0%{transform:scale(0) rotate(180deg)}
  60%{transform:scale(1.1) rotate(-8deg)}
  100%{transform:scale(1) rotate(0deg)}
}
@keyframes sacudir{
  0%,100%{transform:translateX(0)}
  15%,45%,75%{transform:translateX(-6px)}
  30%,60%,90%{transform:translateX(6px)}
}

.error-icono svg{
  width:clamp(36px, 9vw, 44px);
  height:clamp(36px, 9vw, 44px);
  stroke:var(--red-error);
  stroke-width:4;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:60;
  stroke-dashoffset:60;
  animation:dibujarX .5s ease forwards .4s;
}
@keyframes dibujarX{to{stroke-dashoffset:0}}

.error-etiqueta{
  display:inline-block;
  padding:12px 24px;
  border-radius:50px;
  font-weight:800;
  font-size:clamp(14px, 3.8vw, 16px);
  background:linear-gradient(135deg,var(--red-error),var(--red-error-dark));
  color:#fff;
  box-shadow:0 6px 20px rgba(220,38,38,.35);
  animation:etiquetaError .6s ease forwards .4s;
  opacity:0;
  transform:scale(.8);
}
@keyframes etiquetaError{to{opacity:1;transform:scale(1)}}

.error-texto{
  margin-top:18px;
  color:var(--red-error-dark);
  font-size:clamp(14px, 3.8vw, 15px);
  line-height:1.6;
  animation:textoError .6s ease forwards .55s;
  opacity:0;
  transform:translateY(8px);
  text-align:center;
}
@keyframes textoError{to{opacity:1;transform:translateY(0)}}

/* Escáner QR */
.titulo-qr{
  text-align:center;
  color:var(--text-dark);
  font-size:clamp(16px, 4.2vw, 18px);
  font-weight:700;
  margin-bottom:16px;
}
#reader{
  width:100%;
  max-width:260px;
  margin:0 auto;
  border-radius:16px;
  overflow:hidden;
}
.texto-ayuda{
  text-align:center;
  font-size:clamp(12px, 3.2vw, 13px);
  color:var(--text-muted);
  margin:12px 0;
}

/* Loader */
#loader{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.92);
  justify-content:center;
  align-items:center;
  z-index:200;
}
#loader.activo{display:flex}
.spinner{
  width:56px;
  height:56px;
  border-radius:50%;
  border:4px solid var(--adecco-soft);
  border-top-color:var(--adecco);
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Botón instalar */
#installBtn{
  margin-top:16px;
  background:#1F2937;
  color:#fff;
  display:none;
}

/* Responsive — PANTALLAS PEQUEÑAS */
@media(max-width: 360px){
  .card{padding:24px 16px; border-radius:24px;}
  .modal-contenido{padding:24px 16px; border-radius:24px;}
  .foto-contenedor, .foto{width:110px; height:110px;}
  input, button{padding:12px; border-radius:14px;}
}

@media(min-width: 480px){
  body{padding:24px;}
  .card{padding:36px 28px;}
  .modal-contenido{padding:36px 28px;}
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader"><div class="spinner"></div></div>

<!-- MODAL CONFIRMACIÓN -->
<div id="confirmacion" class="modal">
  <div id="confirmBox" class="modal-contenido">
    <div class="icono-check">
      <svg viewBox="0 0 52 52">
        <path d="M14 27 L23 36 L38 16"/>
      </svg>
    </div>
    <div style="text-align:center">
      <div id="etiquetaEstado" class="etiqueta-estado"></div>
      <p id="mensajeConfirmacion" class="mensaje-confirmacion"></p>
    </div>
  </div>
</div>

<!-- MODAL ERROR ANIMADO -->
<div id="modalError" class="modal">
  <div class="modal-contenido">
    <div class="error-icono">
      <svg viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </div>
    <div style="text-align:center">
      <div class="error-etiqueta">⚠️ ERROR</div>
      <p id="textoError" class="error-texto"></p>
    </div>
  </div>
</div>

<!-- MODAL ESCANEO QR -->
<div id="qrModal" class="modal">
  <div class="modal-contenido">
    <h3 id="tipoTitulo" class="titulo-qr"></h3>
    <div id="reader"></div>
    <p class="texto-ayuda">Apunte al código QR para registrar su asistencia</p>
    <button class="btn-cancelar" onclick="cerrarQR()">Cancelar</button>
  </div>
</div>

<!-- PANTALLA PRINCIPAL -->
<div class="card">
  <div class="logo-contenedor">
    <div class="logo-adecco">A<span>D</span>ECCO</div>
    <p class="subtitulo">Sistema de Registro de Asistencia</p>
  </div>

  <!-- PASO 1: INGRESAR DNI -->
  <div id="p1">
    <input 
      id="dni" 
      placeholder="Ingrese su número de DNI" 
      maxlength="8" 
      inputmode="numeric"
      onkeypress="if(event.key==='Enter') buscar()"
    >
    <button id="btnBuscar" class="btn-buscar" onclick="buscar()">🔍 Buscar Empleado</button>
  </div>

  <!-- PASO 2: DATOS DEL TRABAJADOR -->
  <div id="p2" style="display:none;">
    <div class="foto-contenedor">
      <img id="foto" class="foto" alt="Foto del empleado">
    </div>
    <h3 id="nombre" class="nombre"></h3>
    <p id="cargo" class="cargo"></p>
    <div class="reloj" id="hora"></div>
    <div class="fecha" id="fecha"></div>
    <button id="btnEntrada" class="btn-entrada" onclick="abrirQR('ENTRADA')">✅ Registrar ENTRADA</button>
    <button id="btnSalida" class="btn-salida" onclick="abrirQR('SALIDA')">⏰ Registrar SALIDA</button>
  </div>

  <!-- BOTÓN INSTALAR APP -->
  <button id="installBtn">📲 Instalar App</button>
</div>

<script>
// ==============================================
// CONFIGURACIÓN
// ==============================================
const API_URL = "https://script.google.com/macros/s/AKfycbyu5r8QjLQRXEfkCzDgIdtEd6Kgn4lGwRCr57bTy10DVI45PHNB-jlVXeibBEWBOox3/exec";
const QR_VALIDO = "RRHH_ASISTENCIA_OK";
const IMAGEN_POR_DEFECTO = "https://ui-avatars.com/api/?background=E4002B&color=fff&size=130&font-size=0.45&bold=true&name=Adecco";

// ESTADO
let trabajador = {};
let tipoActual = "";
let qr = null;
let bloqueado = false;

// DISPOSITIVO
const deviceId = localStorage.getItem("DEVICE_ID") || crypto.randomUUID();
localStorage.setItem("DEVICE_ID", deviceId);

// ELEMENTOS DEL DOM
const loader = document.getElementById("loader");
const dniInput = document.getElementById("dni");
const p1 = document.getElementById("p1");
const p2 = document.getElementById("p2");
const nombreEl = document.getElementById("nombre");
const cargoEl = document.getElementById("cargo");
const fotoEl = document.getElementById("foto");
const horaEl = document.getElementById("hora");
const fechaEl = document.getElementById("fecha");
const tipoTitulo = document.getElementById("tipoTitulo");
const qrModal = document.getElementById("qrModal");
const confirmacion = document.getElementById("confirmacion");
const confirmBox = document.getElementById("confirmBox");
const etiquetaEstado = document.getElementById("etiquetaEstado");
const mensajeConfirmacion = document.getElementById("mensajeConfirmacion");
const modalError = document.getElementById("modalError");
const textoError = document.getElementById("textoError");
const installBtn = document.getElementById("installBtn");

// ==============================================
// FUNCIONES AUXILIARES
// ==============================================
function mostrarCargando(mostrar = true) {
  loader.classList.toggle("activo", mostrar);
}

// ✅ ERROR ANIMADO — VENTANA PROPIA CON ANIMACIONES
function mostrarError(mensaje) {
  textoError.textContent = mensaje;
  modalError.classList.add("activo");
  // Cerrar automáticamente después de 3 segundos
  setTimeout(() => {
    modalError.classList.remove("activo");
  }, 3000);
  dniInput.focus();
}

function bloquearBotones(activar = true) {
  document.querySelectorAll("button").forEach(btn => btn.disabled = activar);
}

// ==============================================
// BUSCAR TRABAJADOR
// ==============================================
async function buscar() {
  const dni = dniInput.value.trim();
  
  if (dni.length !== 8) {
    mostrarError("Ingrese un DNI válido de 8 dígitos");
    return;
  }

  mostrarCargando(true);
  bloquearBotones(true);

  try {
    const params = new URLSearchParams({ action: "buscar", dni });
    const respuesta = await fetch(API_URL, { method: "POST", body: params });
    const datos = await respuesta.json();

    if (!datos.ok) {
      throw new Error(datos.mensaje || "No se encontró el trabajador");
    }

    trabajador = datos.data;
    
    // Mostrar pantalla de datos
    p1.style.display = "none";
    p2.style.display = "block";
    nombreEl.textContent = trabajador.nombre || "Sin nombre";
    cargoEl.textContent = trabajador.cargo || "";
    fotoEl.src = trabajador.foto?.trim() || IMAGEN_POR_DEFECTO;

  } catch (err) {
    mostrarError(err.message);
  } finally {
    mostrarCargando(false);
    bloquearBotones(false);
  }
}

// ==============================================
// ESCANEO QR
// ==============================================
async function abrirQR(tipo) {
  if (bloqueado) return;

  tipoActual = tipo;
  tipoTitulo.textContent = "📷 Escanear QR — " + tipo;
  qrModal.classList.add("activo");
  bloqueado = true;

  try {
    if (!qr) {
      qr = new Html5Qrcode("reader");
    } else if (qr.isScanning) {
      await qr.stop();
    }

    await qr.start(
      { facingMode: "environment" },
      { fps: 8, qrbox: 200 },
      manejarCodigoQR
    );
  } catch (err) {
    mostrarError("No se pudo acceder a la cámara. Verifique los permisos.");
    cerrarQR();
  }
}

function manejarCodigoQR(textoEscaneado) {
  if (textoEscaneado !== QR_VALIDO) return;
  cerrarQR();
  registrar();
}

async function cerrarQR() {
  qrModal.classList.remove("activo");
  if (qr?.isScanning) {
    try { await qr.stop(); } catch {}
  }
  setTimeout(() => bloqueado = false, 500);
}

// ==============================================
// REGISTRAR ASISTENCIA + GPS
// ==============================================
async function registrar() {
  mostrarCargando(true);

  const opcionesGPS = {
    enableHighAccuracy: true,
    timeout: 10000,
    maximumAge: 300000
  };

  try {
    const posicion = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, opcionesGPS);
    });

    const { latitude: lat, longitude: lng } = posicion.coords;

    const params = new URLSearchParams({
      action: "registrar",
      dni: trabajador.dni,
      nombre: trabajador.nombre,
      cargo: trabajador.cargo,
      tipo: tipoActual,
      lat, lng,
      deviceId,
      qr: QR_VALIDO
    });

    const respuesta = await fetch(API_URL, { method: "POST", body: params });
    const datos = await respuesta.json();

    if (!datos.ok) {
      throw new Error(datos.mensaje || "No se pudo registrar");
    }

    mostrarConfirmacion(tipoActual, datos.mensaje || "Registrado correctamente");
    setTimeout(() => location.reload(), 3200);

  } catch (err) {
    mostrarError(err.message);
    bloqueado = false;
  } finally {
    mostrarCargando(false);
  }
}

// ==============================================
// ✅ CONFIRMACIÓN ANIMADA
// ==============================================
function mostrarConfirmacion(tipo, mensaje) {
  const esEntrada = tipo === "ENTRADA";
  confirmBox.className = "modal-contenido confirm-" + (esEntrada ? "entrada" : "salida");
  etiquetaEstado.textContent = esEntrada ? "✅ ENTRADA REGISTRADA" : "⏰ SALIDA REGISTRADA";
  mensajeConfirmacion.textContent = mensaje;
  confirmacion.classList.add("activo");
  setTimeout(() => confirmacion.classList.remove("activo"), 3000);
}

// ==============================================
// RELOJ EN TIEMPO REAL
// ==============================================
function actualizarReloj() {
  const fecha = new Date();
  horaEl.textContent = fecha.toLocaleTimeString("es-PE");
  fechaEl.textContent = fecha.toLocaleDateString("es-PE", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
  });
}
setInterval(actualizarReloj, 1000);
actualizarReloj();

// ==============================================
// INSTALACIÓN PWA
// ==============================================
let deferredPrompt;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "block";
});

installBtn.addEventListener("click", async () => {
  if (!deferredPrompt) return;
  installBtn.style.display = "none";
  deferredPrompt.prompt();
  deferredPrompt = null;
});

// ==============================================
// SERVICE WORKER
// ==============================================
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const registro = await navigator.serviceWorker.register("sw.js");
      console.log("✅ Service Worker registrado");
    } catch (err) {
      console.warn("⚠️ Service Worker no disponible:", err);
    }
  });
}
</script>
